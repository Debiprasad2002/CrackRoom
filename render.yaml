# Render Blueprint for the CrackRoom API (free plan).
# Database: Supabase Postgres via DATABASE_URL. Add the R2_* variables later to store notes PDFs.
services:
  - type: web
    name: crackroom-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: bash build.sh
    # One ASGI process serves HTTP and the room WebSockets. With the in-memory channel layer it
    # must stay one process; add REDIS_URL before scaling out.
    startCommand: daphne --bind 0.0.0.0 --port $PORT --proxy-headers config.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 733625504886-mru4lult088k54oq4hacuu5mg1qaa9eq.apps.googleusercontent.com
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REFRESH_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
